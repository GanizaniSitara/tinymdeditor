<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --z: 1; }
html, body { height:100%; overflow:hidden; font-family: Arial, Helvetica, sans-serif; background:#fff; color:#222; }

.toolbar {
  height: 36px; background:#f5f5f5; display:flex; align-items:center;
  padding: 0 8px; border-bottom: 1px solid #ddd; font-size:13px; gap:4px;
}
.toolbar button {
  font: 13px Arial, Helvetica, sans-serif; height:26px; min-width:30px; padding:0 9px;
  background:#fff; border:1px solid #c8c8c8; border-radius:3px; color:#222; cursor:pointer;
}
.toolbar button:hover { background:#e8f0fb; border-color:#0366d6; }
.toolbar button.on { background:#dbe7f7; border-color:#0366d6; }
.toolbar .sep { width:10px; }
/* The view switch: three joined icon buttons, the current view shaded. */
.toolbar .views { display:flex; }
.toolbar .views button { min-width:0; padding:0 8px; border-radius:0; margin-left:-1px; }
.toolbar .views button:first-child { border-radius:3px 0 0 3px; margin-left:0; }
.toolbar .views button:last-child { border-radius:0 3px 3px 0; }
.toolbar .views svg { width:22px; height:14px; display:block; fill:none; stroke:#555; stroke-width:1; }
.toolbar .views svg .fill { fill:#9aa4b0; stroke:none; }
.toolbar .views button.on svg { stroke:#0366d6; }
.toolbar .views button.on svg .fill { fill:#0366d6; }
.toolbar .b { font-weight:bold; }
.toolbar .i { font-style:italic; font-family: Georgia, 'Times New Roman', serif; }
.toolbar .filename { color:#0366d6; font-weight:bold; margin-left:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%; }
.toolbar .saved { color:#28a745; opacity:0; transition: opacity 0.3s; white-space:nowrap; }
.toolbar .saved.show { opacity:1; }
.toolbar .ask { display:none; align-items:center; gap:4px; margin-left:auto; }
.toolbar .ask.show { display:flex; }
.toolbar .ask label { color:#555; }
.toolbar .ask input { font: 13px Arial, Helvetica, sans-serif; height:24px; width:260px; padding:0 6px; border:1px solid #0366d6; border-radius:3px; }

.container { display:flex; height:calc(100% - 36px); }

.tree-pane {
  width: 280px; flex-shrink:0; overflow-y:auto; overflow-x:hidden;
  background:#fafafa; border-right:1px solid #ddd;
  font-size: 13px; padding: 8px 0;
}
.tree-pane.hidden { display:none; }
.tree-pane ul { list-style:none; padding-left: 14px; margin:0; }
.tree-pane > ul { padding-left: 8px; }
.tree-pane .node { padding: 2px 6px; cursor: pointer; border-radius:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tree-pane .node:hover { background:#eaeaea; }
.tree-pane .node.file.active { background:#0366d6; color:#fff; }
.tree-pane .node.dir { color:#555; font-weight:600; }
.tree-pane .node.file { color:#0366d6; }
.tree-pane .caret { display:inline-block; width:12px; color:#888; }

.editor-pane {
  flex:1 1 50%; min-width:0; height:100%; display:flex; flex-direction:column;
  overflow:hidden;
}
.editor-pane textarea {
  flex:1; resize:none; border:none; outline:none;
  background:#fff; color:#222; padding:12px 14px; font-size:calc(14px * var(--z));
  font-family: 'Cascadia Code','Consolas','Courier New', monospace;
  line-height:1.6; tab-size:4;
}

.divider {
  width:6px; flex-shrink:0; cursor:col-resize;
  background:#e0e0e0; transition:background 0.15s;
}
.divider:hover, .divider.active { background:#0366d6; }

/* The rendered text runs close to the left edge and uses the full width of the
   pane; View > Wide Margins brings back a roomier page. */
.preview-pane {
  flex:1 1 50%; min-width:0; height:100%; overflow-y:auto; padding:8px 14px 40px 14px;
  background:#fff; outline:none; font-size:calc(16px * var(--z));
  font-variant-ligatures: common-ligatures;
}
body.wide .preview-pane { padding:20px 56px 40px 56px; }
.preview-pane[contenteditable="true"] { caret-color:#111; }
.preview-pane .pending { min-height:1.7em; }

/* View modes */
.container.view-source .preview-pane, .container.view-source .divider { display:none; }
.container.view-rendered .editor-pane, .container.view-rendered .divider { display:none; }
.container.view-source .editor-pane, .container.view-rendered .preview-pane { flex:1 1 100% !important; }

/* Markdown rendered styles */
.preview-pane h1 { font-size:2em; margin:0.5em 0 0.3em; color:#111; border-bottom:1px solid #ddd; padding-bottom:0.2em; }
.preview-pane h2 { font-size:1.5em; margin:0.5em 0 0.3em; color:#111; border-bottom:1px solid #eee; padding-bottom:0.2em; }
.preview-pane h3 { font-size:1.25em; margin:0.5em 0 0.3em; color:#111; }
.preview-pane h4, .preview-pane h5, .preview-pane h6 { margin:0.4em 0; color:#111; }
.preview-pane p { margin:0.5em 0; line-height:1.7; }
.preview-pane a { color:#0366d6; cursor: text; }
body.ctrl-down .preview-pane a { cursor: pointer; }
.preview-pane code {
  background:#f0f0f0; padding:2px 6px; border-radius:3px; font-size:0.9em;
  font-family: 'Cascadia Code','Fira Code','JetBrains Mono','Consolas', monospace;
  font-variant-ligatures: common-ligatures;
}
.preview-pane pre {
  background:#f6f8fa; padding:12px 16px; border-radius:6px; overflow-x:auto;
  margin:0.6em 0; border:1px solid #e1e4e8;
  font-variant-ligatures: common-ligatures;
}
.preview-pane pre code { background:none; padding:0; }
.preview-pane blockquote {
  border-left:4px solid #0366d6; padding:4px 16px; margin:0.6em 0;
  color:#666; background:#f9f9f9;
}
.preview-pane ul, .preview-pane ol { padding-left:1.8em; margin:0.4em 0; }
.preview-pane li { margin:0.2em 0; line-height:1.6; }
.preview-pane table { border-collapse:collapse; margin:0.6em 0; }
.preview-pane th, .preview-pane td { border:1px solid #ddd; padding:6px 12px; }
.preview-pane th { background:#f6f8fa; }
.preview-pane img { max-width:100%; }
.preview-pane hr { border:none; border-top:1px solid #ddd; margin:1em 0; }

/* Scrollbar */
::-webkit-scrollbar { width:10px; }
::-webkit-scrollbar-track { background:#fff; }
::-webkit-scrollbar-thumb { background:#ccc; border-radius:5px; }
::-webkit-scrollbar-thumb:hover { background:#aaa; }

/* Print: show only the formatted preview */
@media print {
  .toolbar, .editor-pane, .divider, .tree-pane { display:none !important; }
  .container { display:block !important; height:auto !important; }
  .preview-pane {
    display:block !important; flex:none !important; width:100% !important; height:auto !important;
    overflow:visible !important; padding:0 !important;
  }
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <span class="views">
    <button data-cmd="viewSource" data-view="source" title="Markdown only (Ctrl+1)"><svg viewBox="0 0 22 14"><rect x="0.5" y="0.5" width="21" height="13" rx="1.5"/><rect class="fill" x="0.5" y="0.5" width="10.5" height="13" rx="1.5"/></svg></button>
    <button data-cmd="split" data-view="split" title="Markdown and rendered side by side (Ctrl+2)"><svg viewBox="0 0 22 14"><rect x="0.5" y="0.5" width="21" height="13" rx="1.5"/><line x1="11" y1="0.5" x2="11" y2="13.5"/></svg></button>
    <button data-cmd="viewRendered" data-view="rendered" title="Rendered only (Ctrl+3)"><svg viewBox="0 0 22 14"><rect x="0.5" y="0.5" width="21" height="13" rx="1.5"/><rect class="fill" x="11" y="0.5" width="10.5" height="13" rx="1.5"/></svg></button>
  </span>
  <span class="sep"></span>
  <button data-cmd="bold" class="b" title="Bold (Ctrl+B)">B</button>
  <button data-cmd="italic" class="i" title="Italic (Ctrl+I)">I</button>
  <button data-cmd="heading" class="b" title="Heading: cycles H1, H2, H3, text (Ctrl+Shift+H)">H</button>
  <button data-cmd="list" title="Bulleted list (Ctrl+Shift+L)">List</button>
  <button data-cmd="link" title="Link (Ctrl+K)">Link</button>
  <button data-cmd="code" title="Inline code, or a code block for several lines (Ctrl+Shift+K)">Code</button>
  <span class="filename" id="fname">TinyMD</span>
  <span class="saved" id="saved">Saved!</span>
  <span class="ask" id="ask"><label id="askLabel">Find:</label><input id="askInput" spellcheck="false"></span>
</div>

<div class="container" id="container">
  <div class="tree-pane hidden" id="tree"></div>
  <div class="editor-pane">
    <textarea id="editor" spellcheck="false" placeholder="Type your Markdown here..."></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="preview-pane" id="preview" spellcheck="false"></div>
</div>

<script>
var _initContent = "{{INIT_CONTENT}}";
var _initFname = "{{INIT_FNAME}}";
var _tree = {{TREE}};
var _settings = {{SETTINGS}};
</script>
<script>
{{MARKED_JS}}
</script>
<script>
{{APP_JS}}
</script>
</body>
</html>
